name: Build demo Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install edge-tts pillow

      - name: Build sample video
        run: .venv/bin/python scripts/make_video.py

      - name: Save video for review
        uses: actions/upload-artifact@v4
        with:
          name: facts-demo-short
          path: output/space_facts_short.mp4
          if-no-files-found: error
          retention-days: 3

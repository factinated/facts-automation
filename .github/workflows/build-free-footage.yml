name: Build free-footage Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install edge-tts pillow

      - name: Build free-footage Short
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: .venv/bin/python scripts/make_pixabay_video.py

      - name: Save video for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: factinated-free-footage-short
          path: |
            output/factinated_free_footage_test.mp4
            output/pixabay_sources.txt
          if-no-files-found: error
          retention-days: 3
